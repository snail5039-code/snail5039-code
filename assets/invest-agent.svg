<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>

  <text x="60" y="78" fill="#F8FAFC" font-size="34" font-weight="700">자연어 투자 에이전트</text>
  <text x="60" y="116" fill="#94A3B8" font-size="19">"SK하이닉스 4주 사줘" → 승인한 주문만 사용자 폰에서 증권사로</text>

  <!-- flow -->
  <g font-size="20" font-weight="600">
    <rect x="60" y="180" width="190" height="96" rx="14" fill="#1E3A8A"/>
    <text x="155" y="222" fill="#FFFFFF" text-anchor="middle">투자 AI</text>
    <text x="155" y="252" fill="#BFDBFE" text-anchor="middle" font-size="16" font-weight="400">출처 ID와 함께 제안</text>

    <rect x="290" y="180" width="190" height="96" rx="14" fill="#7C2D12"/>
    <text x="385" y="222" fill="#FFFFFF" text-anchor="middle">코드 검사</text>
    <text x="385" y="252" fill="#FED7AA" text-anchor="middle" font-size="16" font-weight="400">금액 단위 · 묵은 자료</text>

    <rect x="520" y="180" width="190" height="96" rx="14" fill="#14532D"/>
    <text x="615" y="222" fill="#FFFFFF" text-anchor="middle">검증 AI</text>
    <text x="615" y="252" fill="#BBF7D0" text-anchor="middle" font-size="16" font-weight="400">원문 다시 대조</text>

    <rect x="750" y="180" width="150" height="96" rx="14" fill="#F59E0B"/>
    <text x="825" y="222" fill="#111827" text-anchor="middle">사용자 승인</text>
    <text x="825" y="252" fill="#451A03" text-anchor="middle" font-size="16" font-weight="400">폰에서 주문</text>
  </g>
  <g stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="252" y1="228" x2="286" y2="228"/>
    <line x1="482" y1="228" x2="516" y2="228"/>
    <line x1="712" y1="228" x2="746" y2="228"/>
  </g>
  <path d="M615 280 C615 330, 155 330, 155 282" fill="none" stroke="#F87171" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="385" y="346" fill="#FCA5A5" text-anchor="middle" font-size="16">반려되면 고쳐서 다시 (최대 2번)</text>

  <!-- stats -->
  <g>
    <rect x="60" y="400" width="400" height="140" rx="14" fill="#0B1220" stroke="#334155"/>
    <text x="90" y="448" fill="#94A3B8" font-size="17">틀린 제안 주입 평가</text>
    <text x="90" y="506" fill="#F8FAFC" font-size="44" font-weight="700">19.3 / 20</text>
    <text x="310" y="506" fill="#86EFAC" font-size="20" font-weight="600">차단 · 오탐 0</text>

    <rect x="500" y="400" width="400" height="140" rx="14" fill="#0B1220" stroke="#334155"/>
    <text x="530" y="448" fill="#94A3B8" font-size="17">KIS 모의투자</text>
    <text x="530" y="506" fill="#F8FAFC" font-size="30" font-weight="700">AI 자동매매 매일 운영</text>
  </g>
</svg>
